<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your FinTrack Pro account — start tracking your finances today.">
    <title>Register — FinTrack Pro</title>
    <script src="auth.js"></script>
    <script>checkAuth(false);</script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f7f6;
            padding: 20px;
        }

        .auth-card {
            background: #ffffff;
            padding: 40px 32px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 1px solid #e9e9e9;
        }

        .auth-logo {
            width: 56px;
            height: 56px;
            background-color: #009137;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .auth-logo i {
            font-size: 26px;
            color: #ffffff;
        }

        .auth-card h2 {
            font-size: 22px;
            font-weight: 600;
            color: #1A1D21;
            margin-bottom: 4px;
        }

        .auth-card .subtitle {
            color: #6B7280;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #6B7280;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #e9e9e9;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            color: #1A1D21;
            background: #f8f9fb;
            outline: none;
        }

        .form-group input:focus {
            border-color: #166534;
        }

        .form-group input::placeholder {
            color: #9CA3AF;
        }

        .btn-auth {
            width: 100%;
            padding: 12px;
            background-color: #166534;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
        }

        .auth-footer {
            margin-top: 20px;
            font-size: 14px;
            color: #6B7280;
        }

        .auth-footer a {
            color: #1E40AF;
            text-decoration: none;
            font-weight: 500;
        }

        @media (max-width: 480px) {
            .auth-card { padding: 28px 20px; }
        }
    </style>
</head>
<body>
    <div class="auth-card">

        <h2>Create Account</h2>
        <p class="subtitle">Join FinTrack Pro</p>
        <form id="registerForm">
            <div class="form-group">
                <label for="regUsername">Choose a Username</label>
                <input type="text" id="regUsername" placeholder="Pick a username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="regPassword">Password</label>
                <input type="password" id="regPassword" placeholder="Create a password" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn-auth">Register</button>
        </form>
        <p class="auth-footer">Already have an account? <a href="login.html">Login here</a></p>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var u = document.getElementById('regUsername').value.trim();
            var p = document.getElementById('regPassword').value;
            if (!u) { alert('Please choose a username.'); return; }
            if (!p) { alert('Please create a password.'); return; }
            if (p.length < 3) { alert('Password must be at least 3 characters.'); return; }
            var result = registerUser(u, p, '$');
            if (result.success) {
                alert(result.message);
                setTimeout(function() { window.location.href = 'login.html'; }, 100);
            } else {
                alert(result.message);
            }
        });
    </script>
</body>
</html>
